<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Coins | UnstableMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(11, 9, 20, 0.88), rgba(11, 9, 20, 0.88)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(19, 17, 30, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-btn-yellow {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn-yellow:active { transform: scale(0.97); }
        .glow-btn-yellow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between">

    <!-- Top Header -->
    <header class="w-full py-4 px-4 flex justify-between items-center max-w-md relative">
        <a href="index.html" class="text-purple-400 hover:text-purple-300 text-xs font-semibold flex items-center gap-1.5 bg-purple-500/10 border border-purple-500/30 px-3 py-1.5 rounded-full">
            <i class="fa-solid fa-arrow-left"></i> Home
        </a>
        <div class="flex items-center gap-2">
            <!-- Synced Coin Pill -->
            <div class="flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/30 px-3 py-1.5 rounded-full text-yellow-400 text-xs font-bold shadow-[0_0_10px_rgba(234,179,8,0.15)]">
                <i class="fa-solid fa-coins text-yellow-400 text-[11px]"></i>
                <span id="header-balance">1,000</span>
            </div>
            <!-- 3-Dot Menu Button -->
            <div class="relative">
                <button onclick="toggleMenu()" class="w-9 h-9 rounded-full bg-white/5 border border-white/10 text-gray-300 flex items-center justify-center text-xs hover:bg-white/10 transition">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
                <!-- Dropdown Menu -->
                <div id="dropdown-menu" class="hidden absolute right-0 top-11 w-40 glass-card border border-white/10 rounded-xl shadow-2xl py-2 z-50 flex flex-col">
                    <a href="index.html" class="px-4 py-2 text-xs text-gray-200 hover:bg-white/5 flex items-center gap-2">
                        <i class="fa-solid fa-house text-purple-400"></i> Home
                    </a>
                    <a href="shop.html" class="px-4 py-2 text-xs text-gray-200 hover:bg-white/5 flex items-center gap-2">
                        <i class="fa-solid fa-store text-purple-400"></i> Marketplace
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md px-4 pb-12 flex flex-col gap-6 items-center text-center">

        <!-- Page Header -->
        <section class="py-2 flex flex-col items-center">
            <div class="w-12 h-12 rounded-xl bg-yellow-500/20 text-yellow-400 flex items-center justify-center text-xl mb-2 border border-yellow-500/30">
                <i class="fa-solid fa-dharmachakra"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight">FORTUNE WHEEL</h1>
            <p class="text-gray-400 text-xs mt-1">Spin daily to win up to 2,000 UnstableCoins!</p>
        </section>

        <!-- Wheel Container -->
        <section class="relative w-72 h-72 flex items-center justify-center my-2">
            <!-- Top Triangle Pointer -->
            <div class="absolute -top-3 z-30 w-0 h-0 border-x-[12px] border-x-transparent border-t-[20px] border-t-amber-400 filter drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]"></div>
            
            <!-- Canvas Wheel -->
            <canvas id="wheelCanvas" width="300" height="300" class="w-full h-full rounded-full shadow-[0_0_30px_rgba(0,0,0,0.8)]"></canvas>
            
            <!-- Center Knob -->
            <div class="absolute z-20 w-14 h-14 rounded-full bg-gradient-to-br from-yellow-300 via-amber-400 to-amber-600 border-2 border-amber-200 flex items-center justify-center shadow-[0_0_15px_rgba(0,0,0,0.6)]">
                <div class="w-6 h-6 rotate-45 bg-amber-700/80 border border-amber-300 flex items-center justify-center">
                    <div class="w-2 h-2 bg-yellow-200"></div>
                </div>
            </div>
        </section>

        <!-- Spin Action Button -->
        <button id="spin-btn" onclick="spinWheel()" class="w-full glow-btn-yellow text-black font-black py-4 rounded-xl text-sm uppercase tracking-wider flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> SPIN THE WHEEL
        </button>

        <!-- Info Card -->
        <section class="glass-card w-full p-4 rounded-2xl flex flex-col gap-2 text-left border border-white/5 text-xs text-gray-300">
            <h2 class="font-black text-yellow-400 uppercase tracking-wider mb-1">Wheel Rules</h2>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-green-400 text-[10px]"></i>
                <span>Spin once every 24 hours for free coins.</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-green-400 text-[10px]"></i>
                <span>Prizes range from 5 to 2,000 UnstableCoins instantly.</span>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-white/5">
        <p>&copy; 2026 UnstableMC. All rights reserved.</p>
    </footer>

    <!-- Result / Win Modal -->
    <div id="win-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-card p-6 rounded-2xl max-w-xs w-full text-center flex flex-col gap-4 border border-yellow-500/30 shadow-[0_0_30px_rgba(234,179,8,0.3)]">
            <div class="w-16 h-16 mx-auto rounded-full bg-yellow-500/20 text-yellow-400 flex items-center justify-center text-3xl border border-yellow-500/40">
                <i class="fa-solid fa-coins"></i>
            </div>
            <div>
                <h3 class="text-lg font-black text-white">CONGRATULATIONS!</h3>
                <p class="text-xs text-gray-400 mt-1">You won <span id="won-amount" class="text-yellow-400 font-bold">0</span> UnstableCoins!</p>
            </div>
            <button onclick="closeModal()" class="w-full glow-btn-yellow text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider">
                Claim Reward
            </button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const COIN_KEY = 'unstableCoins';
        
        function getBalance() {
            if (!localStorage.getItem(COIN_KEY)) {
                localStorage.setItem(COIN_KEY, '1000');
            }
            return Number(localStorage.getItem(COIN_KEY));
        }

        function setBalance(val) {
            localStorage.setItem(COIN_KEY, val);
            updateDisplay();
        }

        function updateDisplay() {
            const balance = getBalance();
            const el = document.getElementById('header-balance');
            if (el) el.innerText = balance.toLocaleString();
        }

        document.addEventListener('DOMContentLoaded', updateDisplay);
        updateDisplay();

        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('button')) {
                document.getElementById('dropdown-menu').classList.add('hidden');
            }
        });

        // Wheel Configuration (matching reference image)
        const slices = [
            { text: '50', color: '#ec4899', value: 50 },
            { text: '2000', color: '#facc15', value: 2000 },
            { text: '5', color: '#06b6d4', value: 5 },
            { text: '15', color: '#6366f1', value: 15 },
            { text: '100', color: '#f59e0b', value: 100 },
            { text: '10', color: '#38bdf8', value: 10 },
            { text: '30', color: '#a855f7', value: 30 },
            { text: '5', color: '#06b6d4', value: 5 },
            { text: '250', color: '#f97316', value: 250 },
            { text: '15', color: '#818cf8', value: 15 },
            { text: '10', color: '#38bdf8', value: 10 },
            { text: '500', color: '#ef4444', value: 500 },
            { text: '5', color: '#10b981', value: 5 },
            { text: '20', color: '#a855f7', value: 20 },
            { text: '75', color: '#f43f5e', value: 75 },
            { text: '10', color: '#38bdf8', value: 10 },
            { text: '850', color: '#dc2626', value: 850 },
            { text: '5', color: '#06b6d4', value: 5 },
            { text: '30', color: '#c084fc', value: 30 },
            { text: '20', color: '#8b5cf6', value: 20 }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = slices.length;
        const arc = (2 * Math.PI) / numSlices;
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel(angle = 0) {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle);

            // Draw Slices
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * arc;
                const endAngle = (i + 1) * arc;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 10, startAngle, endAngle);
                ctx.fillStyle = slices[i].color;
                ctx.fill();
                ctx.strokeStyle = '#1e1b4b';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(slices[i].text, radius - 25, 5);
                ctx.restore();
            }
            ctx.restore();

            // Draw Golden Outer Rim
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 5, 0, 2 * Math.PI);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#eab308';
            ctx.stroke();

            // Draw Glowing Dots on Rim
            const dotCount = 16;
            for (let i = 0; i < dotCount; i++) {
                const angle = (i * 2 * Math.PI) / dotCount;
                const x = radius + (radius - 5) * Math.cos(angle);
                const y = radius + (radius - 5) * Math.sin(angle);
                ctx.beginPath();
                ctx.arc(x, y, 3.5, 0, 2 * Math.PI);
                ctx.fillStyle = '#fef08a';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 8;
                ctx.fill();
            }
        }

        drawWheel(currentAngle);

        let wonCoinValue = 0;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            // Random spin between 5 and 8 full rotations + random slice offset
            const randomSliceIndex = Math.floor(Math.random() * numSlices);
            const extraSpins = 360 * (6 + Math.floor(Math.random() * 3));
            const degreesPerSlice = 360 / numSlices;
            // Pointer is at top (270 deg / -90 deg in canvas terms)
            const targetAngle = extraSpins + (360 - (randomSliceIndex * degreesPerSlice)) + (degreesPerSlice / 2);
            
            const startAngle = currentAngle;
            const totalRotation = (targetAngle * Math.PI) / 180;
            const duration = 4000; // 4 seconds
            let startTime = null;

            function animateSpin(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease-out cubic deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + totalRotation * easeOut;

                drawWheel(currentAngle);

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    currentAngle = currentAngle % (2 * Math.PI);
                    
                    // Determine winning slice
                    wonCoinValue = slices[randomSliceIndex].value;
                    
                    // Show win modal
                    document.getElementById('won-amount').innerText = wonCoinValue.toLocaleString();
                    document.getElementById('win-modal').classList.remove('hidden');
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function closeModal() {
            document.getElementById('win-modal').classList.add('hidden');
            const newBalance = getBalance() + wonCoinValue;
            setBalance(newBalance);
            document.getElementById('spin-btn').disabled = false;
        }
    </script>
</body>
</html>
