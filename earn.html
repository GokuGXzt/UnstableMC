<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Coins | UnstableMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(11, 9, 20, 0.88), rgba(11, 9, 20, 0.88)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            touch-action: none;
        }
        .glass-card {
            background: rgba(19, 17, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-btn-yellow {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn-yellow:active { transform: scale(0.97); }
        .glow-btn-yellow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between">

    <!-- Top Header -->
    <header class="w-full py-4 px-4 flex justify-between items-center max-w-md relative">
        <a href="index.html" class="text-purple-400 hover:text-purple-300 text-xs font-semibold flex items-center gap-1.5 bg-purple-500/10 border border-purple-500/30 px-3 py-1.5 rounded-full">
            <i class="fa-solid fa-arrow-left"></i> Home
        </a>
        <div class="flex items-center gap-2">
            <!-- Synced Coin Pill -->
            <div class="flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/30 px-3 py-1.5 rounded-full text-yellow-400 text-xs font-bold shadow-[0_0_10px_rgba(234,179,8,0.15)]">
                <i class="fa-solid fa-coins text-yellow-400 text-[11px]"></i>
                <span id="header-balance">1,000</span>
            </div>
            <!-- 3-Dot Menu Button -->
            <div class="relative">
                <button onclick="toggleMenu()" class="w-9 h-9 rounded-full bg-white/5 border border-white/10 text-gray-300 flex items-center justify-center text-xs hover:bg-white/10 transition">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
                <!-- Dropdown Menu -->
                <div id="dropdown-menu" class="hidden absolute right-0 top-11 w-40 glass-card border border-white/10 rounded-xl shadow-2xl py-2 z-50 flex flex-col">
                    <a href="index.html" class="px-4 py-2 text-xs text-gray-200 hover:bg-white/5 flex items-center gap-2">
                        <i class="fa-solid fa-house text-purple-400"></i> Home
                    </a>
                    <a href="shop.html" class="px-4 py-2 text-xs text-gray-200 hover:bg-white/5 flex items-center gap-2">
                        <i class="fa-solid fa-store text-purple-400"></i> Marketplace
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md px-4 pb-12 flex flex-col gap-6 items-center text-center">

        <!-- Page Header -->
        <section class="py-1 flex flex-col items-center">
            <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl mb-2 border border-purple-500/30">
                <i class="fa-solid fa-gift"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight">EARN UNSTABLECOINS</h1>
            <p class="text-gray-400 text-xs mt-1">Spin the wheel to win big!</p>
        </section>

        <!-- SPIN WHEEL SECTION -->
        <div id="section-wheel" class="w-full flex flex-col gap-5 items-center">
            <!-- Spins Left Counter Badge -->
            <div class="bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs text-gray-300 flex items-center gap-2">
                <i class="fa-solid fa-rotate text-yellow-400"></i>
                <span>Spins Available: <strong id="spins-left-count" class="text-yellow-400 font-black">10</strong> / 10</span>
            </div>

            <!-- Wheel Container -->
            <section class="relative w-72 h-72 flex items-center justify-center my-1">
                <!-- Top Triangle Pointer -->
                <div class="absolute -top-3 z-30 w-0 h-0 border-x-[12px] border-x-transparent border-t-[20px] border-t-amber-400 filter drop-shadow-[0_2px_6px_rgba(234,179,8,0.8)]"></div>
                
                <!-- Canvas Wheel -->
                <canvas id="wheelCanvas" class="w-72 h-72 rounded-full shadow-[0_0_35px_rgba(0,0,0,0.8)] bg-gray-900"></canvas>
                
                <!-- Center Knob -->
                <div class="absolute z-20 w-14 h-14 rounded-full bg-gradient-to-br from-yellow-300 via-amber-400 to-amber-600 border-2 border-amber-200 flex items-center justify-center shadow-[0_0_15px_rgba(0,0,0,0.6)] pointer-events-none">
                    <div class="w-6 h-6 rotate-45 bg-amber-700/80 border border-amber-300 flex items-center justify-center">
                        <div class="w-2 h-2 bg-yellow-200"></div>
                    </div>
                </div>
            </section>

            <!-- Spin Action Button & Cooldown Timer -->
            <div class="w-full flex flex-col gap-2">
                <button id="spin-btn" onclick="spinWheel()" class="w-full glow-btn-yellow text-black font-black py-4 rounded-xl text-sm uppercase tracking-wider flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> SPIN THE WHEEL
                </button>
                <p id="spin-timer" class="text-xs text-amber-400 font-semibold hidden"></p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-white/5">
        <p>&copy; 2026 UnstableMC. All rights reserved.</p>
    </footer>

    <!-- Result / Win Modal (Wheel) -->
    <div id="win-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-card p-6 rounded-2xl max-w-xs w-full text-center flex flex-col gap-4 border border-yellow-500/30 shadow-[0_0_30px_rgba(234,179,8,0.3)]">
            <div class="w-16 h-16 mx-auto rounded-full bg-yellow-500/20 text-yellow-400 flex items-center justify-center text-3xl border border-yellow-500/40">
                <i class="fa-solid fa-coins"></i>
            </div>
            <div>
                <h3 class="text-lg font-black text-white">CONGRATULATIONS!</h3>
                <p class="text-xs text-gray-400 mt-1">You won <span id="won-amount" class="text-yellow-400 font-bold">0</span> UnstableCoins!</p>
            </div>
            <button onclick="closeModal()" class="w-full glow-btn-yellow text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider">
                Claim Reward
            </button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const COIN_KEY = 'unstableCoins';
        const SPINS_KEY = 'unstableSpinsLeft';
        const RESET_KEY = 'unstableLastReset';
        const MAX_SPINS = 10;
        const COOLDOWN_HOURS = 24;
        const COOLDOWN_MS = COOLDOWN_HOURS * 60 * 60 * 1000;

        function getBalance() {
            if (!localStorage.getItem(COIN_KEY)) {
                localStorage.setItem(COIN_KEY, '1000');
            }
            return Number(localStorage.getItem(COIN_KEY));
        }

        function setBalance(val) {
            localStorage.setItem(COIN_KEY, val);
            updateBalanceDisplay();
        }

        function updateBalanceDisplay() {
            const balance = getBalance();
            const el = document.getElementById('header-balance');
            if (el) el.innerText = balance.toLocaleString();
        }

        function checkAndResetSpins() {
            const now = Date.now();
            let lastReset = localStorage.getItem(RESET_KEY);
            let spins = localStorage.getItem(SPINS_KEY);

            if (!lastReset || !spins) {
                localStorage.setItem(RESET_KEY, now);
                localStorage.setItem(SPINS_KEY, MAX_SPINS);
                return MAX_SPINS;
            }

            if (now - Number(lastReset) >= COOLDOWN_MS) {
                localStorage.setItem(RESET_KEY, now);
                localStorage.setItem(SPINS_KEY, MAX_SPINS);
                return MAX_SPINS;
            }

            return Number(spins);
        }

        function getRemainingTime() {
            const lastReset = Number(localStorage.getItem(RESET_KEY) || Date.now());
            const now = Date.now();
            const elapsed = now - lastReset;
            const remaining = COOLDOWN_MS - elapsed;
            return remaining > 0 ? remaining : 0;
        }

        function updateSpinsUI() {
            const spins = checkAndResetSpins();
            const countEl = document.getElementById('spins-left-count');
            const btn = document.getElementById('spin-btn');
            const timerEl = document.getElementById('spin-timer');

            if (countEl) countEl.innerText = spins;

            if (spins <= 0) {
                btn.disabled = true;
                const remaining = getRemainingTime();
                if (remaining > 0) {
                    const hours = Math.floor(remaining / (1000 * 60 * 60));
                    const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                    if (timerEl) {
                        timerEl.innerText = `Next 10 spins in: ${hours}h ${minutes}m ${seconds}s`;
                        timerEl.classList.remove('hidden');
                    }
                } else {
                    checkAndResetSpins();
                    updateSpinsUI();
                }
            } else {
                btn.disabled = false;
                if (timerEl) timerEl.classList.add('hidden');
            }
        }

        setInterval(updateSpinsUI, 1000);

        updateBalanceDisplay();
        updateSpinsUI();

        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('button')) {
                const menu = document.getElementById('dropdown-menu');
                if (menu) menu.classList.add('hidden');
            }
        });

        // Wheel Configuration
        const slices = [
            { text: '50', color: '#ec4899', value: 50 },
            { text: '2000', color: '#facc15', value: 2000 },
            { text: '5', color: '#06b6d4', value: 5 },
            { text: '15', color: '#6366f1', value: 15 },
            { text: '100', color: '#f59e0b', value: 100 },
            { text: '10', color: '#38bdf8', value: 10 },
            { text: '30', color: '#a855f7', value: 30 },
            { text: '5', color: '#06b6d4', value: 5 },
            { text: '250', color: '#f97316', value: 250 },
            { text: '15', color: '#818cf8', value: 15 },
            { text: '10', color: '#38bdf8', value: 10 },
            { text: '500', color: '#ef4444', value: 500 },
            { text: '5', color: '#10b981', value: 5 },
            { text: '20', color: '#a855f7', value: 20 },
            { text: '75', color: '#f43f5e', value: 75 },
            { text: '10', color: '#38bdf8', value: 10 },
            { text: '850', color: '#dc2626', value: 850 },
            { text: '5', color: '#06b6d4', value: 5 },
            { text: '30', color: '#c084fc', value: 30 },
            { text: '20', color: '#8b5cf6', value: 20 }
        ];

        let canvas, ctx, numSlices, arc, radius;
        let currentAngle = 0;
        let isSpinning = false;
        let wonCoinValue = 0;

        function initWheel() {
            canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;

            ctx = canvas.getContext('2d');
            numSlices = slices.length;
            arc = (2 * Math.PI) / numSlices;

            // --- High-DPI / Retina Clarity Scaling ---
            const dpr = window.devicePixelRatio || 1;
            const displaySize = 300; // CSS logical pixels
            
            canvas.width = displaySize * dpr;
            canvas.height = displaySize * dpr;
            
            ctx.scale(dpr, dpr);
            radius = displaySize / 2;

            drawWheel(currentAngle);
        }

        function drawWheel(angle = 0) {
            if (!ctx) return;
            ctx.clearRect(0, 0, radius * 2, radius * 2);

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * arc;
                const endAngle = (i + 1) * arc;

                // Slice Background
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 10, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = slices[i].color;
                ctx.fill();
                ctx.strokeStyle = '#1e1b4b';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Crisp Text Rendering
                ctx.save();
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 5;
                ctx.fillText(slices[i].text, radius - 26, 0);
                ctx.restore();
            }
            ctx.restore();

            // Outer Gold Ring Border
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 5, 0, 2 * Math.PI);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#eab308';
            ctx.stroke();

            // Glowing Edge Dots
            const dotCount = 16;
            for (let i = 0; i < dotCount; i++) {
                const dotAngle = (i * 2 * Math.PI) / dotCount;
                const x = radius + (radius - 5) * Math.cos(dotAngle);
                const y = radius + (radius - 5) * Math.sin(dotAngle);
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#fef08a';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 8;
                ctx.fill();
            }
        }

        initWheel();
        window.addEventListener('load', initWheel);
        window.addEventListener('resize', initWheel);

        function spinWheel() {
            if (isSpinning) return;
            
            let spins = checkAndResetSpins();
            if (spins <= 0) {
                updateSpinsUI();
                return;
            }

            spins--;
            localStorage.setItem(SPINS_KEY, spins);
            updateSpinsUI();

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            const winningIndex = Math.floor(Math.random() * numSlices);
            wonCoinValue = slices[winningIndex].value;

            const sliceCenter = winningIndex * arc + arc / 2;
            let desiredFinalAngle = (3 * Math.PI / 2) - sliceCenter;
            const extraSpins = (6 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
            desiredFinalAngle += extraSpins;

            while (desiredFinalAngle < currentAngle + (5 * 2 * Math.PI)) {
                desiredFinalAngle += 2 * Math.PI;
            }

            const startAngle = currentAngle;
            const totalRotation = desiredFinalAngle - startAngle;
            const duration = 4000;
            let startTime = null;

            function animateSpin(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + totalRotation * easeOut;

                drawWheel(currentAngle);

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    currentAngle = desiredFinalAngle % (2 * Math.PI);
                    drawWheel(currentAngle);
                    
                    document.getElementById('won-amount').innerText = wonCoinValue.toLocaleString();
                    document.getElementById('win-modal').classList.remove('hidden');
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function closeModal() {
            document.getElementById('win-modal').classList.add('hidden');
            const newBalance = getBalance() + wonCoinValue;
            setBalance(newBalance);
            updateSpinsUI();
        }
    </script>
</body>
</html>
